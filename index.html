<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Welcome to Heart Gallery ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    min-height: 100dvh;
    overflow-x: hidden;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
}

body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 20px 16px;
    position: relative;
    perspective: 1200px;
}

/* Mobile Tap-To-Unlock Overlay (Hidden by Default) */
#welcomeOverlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    background: rgba(15, 12, 41, 0.92);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10000;
    transition: opacity 0.5s ease, visibility 0.5s ease;
    padding: 20px;
    opacity: 0;
    visibility: hidden;
}

/* Shown on Mobile */
#welcomeOverlay.active {
    opacity: 1;
    visibility: visible;
}

.welcome-box {
    text-align: center;
    color: white;
    padding: 30px 20px;
    border-radius: 20px;
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
    width: 100%;
    max-width: 320px;
}

.welcome-box h1 {
    font-size: 22px;
    margin-bottom: 8px;
    font-weight: 700;
}

.welcome-box p {
    font-size: 13px;
    color: #e0e0e0;
    margin-bottom: 22px;
}

.enter-btn {
    width: 100%;
    padding: 14px 0;
    font-size: 15px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    background: linear-gradient(45deg, #ff6ec4, #7873f5);
    color: white;
    font-weight: 600;
    box-shadow: 0 10px 25px rgba(255, 110, 196, 0.4);
    animation: pulse 1.8s infinite;
}

@keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.03); }
    100% { transform: scale(1); }
}

/* Background Floating Circles */
.background {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: 0;
    pointer-events: none;
}

.circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, .06);
    animation: float 12s linear infinite;
}

.circle:nth-child(1) {
    width: 250px;
    height: 250px;
    left: -40px;
    top: 10%;
}

.circle:nth-child(2) {
    width: 180px;
    height: 180px;
    right: -30px;
    top: 50%;
    animation-duration: 10s;
}

.circle:nth-child(3) {
    width: 300px;
    height: 300px;
    bottom: -60px;
    left: 20%;
    animation-duration: 15s;
}

@keyframes float {
    0% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-30px) rotate(180deg); }
    100% { transform: translateY(0) rotate(360deg); }
}

/* Header */
header {
    margin-bottom: 20px;
    font-size: clamp(24px, 5vw, 32px);
    font-weight: 700;
    color: white;
    letter-spacing: 2px;
    text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
    text-align: center;
    z-index: 5;
}

/* Responsive Glass Card */
.card {
    width: 100%;
    max-width: 400px;
    padding: 32px 24px;
    border-radius: 24px;
    background: rgba(255, 255, 255, .15);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, .25);
    box-shadow: 0 20px 40px rgba(0, 0, 0, .25);
    text-align: center;
    animation: fadeIn 1s ease-out;
    z-index: 5;
    transform-style: preserve-3d;
    transition: transform 0.2s ease-out;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.image {
    width: clamp(220px, 60vw, 280px);
    height: clamp(220px, 60vw, 280px);
    margin: 0 auto 22px;
    border-radius: 50%;
    overflow: hidden;
    border: 8px solid rgba(255, 255, 255, .4);
    box-shadow: 0 0 20px rgba(255, 255, 255, .3), 0 0 30px rgba(255, 105, 180, .35);
}

.image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}

.card h2 {
    color: white;
    font-size: clamp(18px, 4.5vw, 22px);
    font-weight: 600;
}

.card p {
    margin-top: 12px;
    color: #f1f1f1;
    font-size: clamp(13px, 3.5vw, 14.5px);
    line-height: 1.55;
    font-style: italic;
    white-space: pre-line;
}

/* Action Button */
.action-btn {
    width: 100%;
    margin-top: 22px;
    padding: 13px 0;
    font-size: 15px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    background: linear-gradient(45deg, #ff6ec4, #7873f5);
    color: white;
    font-weight: 600;
    box-shadow: 0 10px 22px rgba(0, 0, 0, .25);
    transition: transform 0.2s ease;
}

.action-btn:hover {
    transform: scale(1.02);
}

.action-btn:active {
    transform: scale(0.96);
}

/* Floating Emoji Overlay */
#hearts {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100dvh;
    pointer-events: none;
    overflow: hidden;
    z-index: 999;
}

.floating-item {
    position: absolute;
    animation-name: fall;
    animation-timing-function: linear;
    user-select: none;
    will-change: transform;
    text-shadow: 0 0 6px #ff4d6d;
}

@keyframes fall {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    15% {
        opacity: 1;
    }
    100% {
        transform: translateY(105dvh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<!-- Mobile Tap Overlay -->
<div id="welcomeOverlay">
    <div class="welcome-box">
        <h1>Welcome Sanyukta ❤️</h1>
        <p>Turn your phone volume up ✨</p>
        <button class="enter-btn" id="startBtn">Tap to Open ❤️</button>
    </div>
</div>

<!-- Background Audio -->
<audio id="bgMusic" loop preload="auto">
    <source src="raabta_slowed.mp3" type="audio/mpeg">
</audio>

<div class="background">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<div class="hearts" id="hearts"></div>

<header>Welcome Sanyukta</header>

<div class="card">
    <div class="image">
        <img src="Our image.jpg" alt="Our Memory">
    </div>

    <h2>A Memory for you Princess ❤️</h2>

    <p>"Pehli mulaqat be-khabar thi, par ab ehsaas rang laaya hai,
Is baar mile hain kuch aise, ki dil ne farz nibhaya hai"</p>

    <button class="action-btn" onclick="navigateToSurprise()">
        Click to pop this card
    </button>
</div>

<script>
function navigateToSurprise() {
    const music = document.getElementById("bgMusic");
    if (music) {
        music.pause();
    }
    window.location.href = 'surprise.html';
}

document.addEventListener("DOMContentLoaded", () => {
    const music = document.getElementById("bgMusic");
    const startBtn = document.getElementById("startBtn");
    const welcomeOverlay = document.getElementById("welcomeOverlay");

    // Detect Mobile/Touch Device
    const isMobile = window.matchMedia("(pointer: coarse)").matches || 'ontouchstart' in window;

    const playWithFadeIn = () => {
        if (!music) return;
        music.volume = 0;
        music.play().then(() => {
            let volume = 0;
            const fade = setInterval(() => {
                volume += 0.05;
                if (volume >= 1) {
                    volume = 1;
                    clearInterval(fade);
                }
                music.volume = volume;
            }, 100);
        }).catch(err => {
            console.log("Audio play blocked:", err);
        });
    };

    if (isMobile) {
        // Show Tap Overlay specifically on Mobile screens
        welcomeOverlay.classList.add("active");

        if (startBtn) {
            startBtn.addEventListener("click", () => {
                playWithFadeIn();
                welcomeOverlay.classList.remove("active");
            });
        }
    } else {
        // Desktop: Skip overlay & start audio on first interaction or page load
        playWithFadeIn();

        const unlockDesktopAudio = () => {
            playWithFadeIn();
            window.removeEventListener("click", unlockDesktopAudio);
        };
        window.addEventListener("click", unlockDesktopAudio);
    }

    // Floating Emojis
    const hearts = document.getElementById("hearts");
    if (hearts) {
        function createHeart() {
            const heart = document.createElement("span");
            const items = ["✨", "🌸", "💫", "🦋", "🪷", "💖", "🍫"];

            heart.textContent = items[Math.floor(Math.random() * items.length)];
            heart.classList.add("floating-item");

            const duration = 4 + Math.random() * 3;
            heart.style.left = Math.random() * 95 + "vw";
            heart.style.top = "-40px";
            heart.style.animationDuration = duration + "s";
            heart.style.fontSize = (15 + Math.random() * 12) + "px";

            hearts.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createHeart, 350);
    }

    // 3D Card Tilt for Desktop Cursor
    const card = document.querySelector(".card");
    if (card && !isMobile) {
        document.addEventListener("mousemove", (e) => {
            const x = (window.innerWidth / 2 - e.clientX) / 25;
            const y = (window.innerHeight / 2 - e.clientY) / 25;

            card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });

        document.addEventListener("mouseleave", () => {
            card.style.transform = "rotateY(0deg) rotateX(0deg)";
        });
    }
});
</script>

</body>
</html>
