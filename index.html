<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Heart Gallery ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(135deg, #1f1c2c, #928dab);
    display: flex;
    justify-content: center;
    align-items: center;
    perspective: 1500px;
}

/* Background Animated Circles */
.background {
    position: absolute;
    width: 100%;
    height: 100%;
    overflow: hidden;
    z-index: -2;
}

.circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, .08);
    animation: float 15s linear infinite;
}

.circle:nth-child(1) {
    width: 400px;
    height: 400px;
    left: 10%;
    top: 20%;
    animation-duration: 18s;
}

.circle:nth-child(2) {
    width: 200px;
    height: 200px;
    right: 10%;
    top: 10%;
    animation-duration: 12s;
}

.circle:nth-child(3) {
    width: 400px;
    height: 400px;
    bottom: -100px;
    left: 40%;
    animation-duration: 20s;
}

@keyframes float {
    0% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-60px) rotate(180deg); }
    100% { transform: translateY(0) rotate(360deg); }
}

/* Header */
header {
    position: absolute;
    top: 25px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 34px;
    font-weight: 700;
    color: white;
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
    z-index: 10;
}

/* Glass Card */
.card {
    width: 420px;
    padding: 35px;
    border-radius: 25px;
    background: rgba(255, 255, 255, .15);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, .25);
    box-shadow: 0 25px 50px rgba(0, 0, 0, .3), 0 0 40px rgba(255, 255, 255, .08);
    text-align: center;
    transform-style: preserve-3d;
    transition: transform 0.2s ease-out;
    animation: fadeIn 1.5s ease;
    z-index: 5;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(40px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.image {
    width: 230px;
    height: 230px;
    margin: 0 auto 20px;
    border-radius: 50%;
    overflow: hidden;
    border: 5px solid rgba(255, 255, 255, .4);
    box-shadow: 0 0 20px rgba(255, 255, 255, .35), 0 0 40px rgba(255, 105, 180, .4);
    transition: transform 0.4s ease;
}

.image:hover {
    transform: scale(1.05);
}

.image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
}

.card h2 {
    margin-top: 10px;
    color: white;
    font-size: 24px;
    font-weight: 600;
}

.card p {
    margin-top: 15px;
    color: #f1f1f1;
    font-size: 15px;
    line-height: 26px;
    font-style: italic;
    white-space: pre-line;
}

/* Button */
button {
    margin-top: 25px;
    padding: 14px 35px;
    font-size: 16px;
    border: none;
    border-radius: 40px;
    cursor: pointer;
    background: linear-gradient(45deg, #ff6ec4, #7873f5);
    color: white;
    font-weight: 600;
    transition: all 0.3s ease;
    box-shadow: 0 15px 35px rgba(0, 0, 0, .25);
}

button:hover {
    transform: translateY(-4px) scale(1.04);
    box-shadow: 0 20px 45px rgba(255, 105, 180, .5);
}

/* Floating Emojis Overlay */
#hearts {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    overflow: hidden;
    z-index: 999;
}

.floating-item {
    position: absolute;
    animation-name: fall;
    animation-timing-function: linear;
    user-select: none;
    will-change: transform;
    text-shadow: 0 0 8px #ff4d6d, 0 0 20px #ff4d6d;
}

@keyframes fall {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
    }
    15% {
        opacity: 1;
    }
    100% {
        transform: translateY(105vh) rotate(360deg);
        opacity: 0;
    }
}
</style>
</head>

<body>

<!-- Background Audio -->
<audio id="bgMusic" autoplay loop>
    <source src="raabta_slowed.mp3.mp3" type="audio/mpeg">
</audio>

<div class="background">
    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>
</div>

<div class="hearts" id="hearts"></div>

<header>Welcome Sanyukta</header>

<div class="card">
    <div class="image">
        <img src="Our image.jpg" alt="Our Memory">
    </div>

    <h2>A Memory for you Princess ❤️</h2>

    <p>"Pehli mulaqat be-khabar thi, par ab ehsaas rang laaya hai,
Is baar mile hain kuch aise, ki dil ne farz nibhaya hai"</p>

    <button onclick="window.location.href='surprise.html'">
        Click to pop this card
    </button>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    // 1. Audio Auto-Play & Smooth Fade-In
    const music = document.getElementById("bgMusic");
    if (music) {
        music.volume = 0;

        const playPromise = music.play();
        if (playPromise !== undefined) {
            playPromise.then(() => {
                let volume = 0;
                const fade = setInterval(() => {
                    volume += 0.05;
                    if (volume >= 1) {
                        volume = 1;
                        clearInterval(fade);
                    }
                    music.volume = volume;
                }, 150);
            }).catch(() => {
                // Fallback for browsers that block immediate autoplay
                document.body.addEventListener("click", () => {
                    music.play();
                    let volume = 0;
                    const fade = setInterval(() => {
                        volume += 0.05;
                        if (volume >= 1) {
                            volume = 1;
                            clearInterval(fade);
                        }
                        music.volume = volume;
                    }, 150);
                }, { once: true });
            });
        }
    }

    // 2. Floating Emojis Animation
    const hearts = document.getElementById("hearts");
    if (hearts) {
        function createHeart() {
            const heart = document.createElement("span");
            const items = ["✨", "🌸", "💫", "🦋", "🪷", "💖", "🍫"];

            heart.textContent = items[Math.floor(Math.random() * items.length)];
            heart.classList.add("floating-item");

            const duration = 4 + Math.random() * 4;
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.top = "-50px";
            heart.style.animationDuration = duration + "s";
            heart.style.fontSize = (18 + Math.random() * 18) + "px";

            hearts.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, duration * 1000);
        }

        setInterval(createHeart, 250);
    }

    // 3. 3D Dynamic Interactive Card Tilt
    const card = document.querySelector(".card");
    if (card) {
        document.addEventListener("mousemove", (e) => {
            const x = (window.innerWidth / 2 - e.clientX) / 25;
            const y = (window.innerHeight / 2 - e.clientY) / 25;

            card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
        });

        document.addEventListener("mouseleave", () => {
            card.style.transform = "rotateY(0deg) rotateX(0deg)";
        });
    }
});
</script>

</body>
</html>
