<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome to Heart Gallery ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;
overflow:hidden;
background:linear-gradient(135deg,#1f1c2c,#928dab);
display:flex;
justify-content:center;
align-items:center;
perspective:1500px;
}

/* Background */

.background{

position:absolute;
width:100%;
height:100%;
overflow:hidden;
z-index:-2;

}

.circle{

position:absolute;
border-radius:50%;
background:rgba(255,255,255,.08);
animation:float 15s linear infinite;

}

.circle:nth-child(1){
width:400px;
height:400px;
left:10%;
top:20%;
animation-duration:18s;
}

.circle:nth-child(2){
width:200px;
height:200px;
right:10%;
top:10%;
animation-duration:12s;
}

.circle:nth-child(3){
width:400px;
height:400px;
bottom:-100px;
left:40%;
animation-duration:20s;
}

@keyframes float{

0%{
transform:translateY(0) rotate(0deg);
}
50%{
transform:translateY(-60px) rotate(180deg);
}
100%{
transform:translateY(0) rotate(360deg);
}

}

/* Header */

header{

position:absolute;
top:20px;
left:50%;
transform:translateX(-50%);
font-size:34px;
font-weight:700;
color:white;
letter-spacing:4px;
text-shadow:0 0 20px #ffffff88;

}

/* Glass Card */

.card{

width:420px;
padding:35px;
border-radius:25px;

background:rgba(255,255,255,.15);
backdrop-filter:blur(15px);
-webkit-backdrop-filter:blur(15px);

border:1px solid rgba(255,255,255,.25);

box-shadow:
0 25px 50px rgba(0,0,0,.3),
0 0 40px rgba(255,255,255,.08);

text-align:center;

transform-style:preserve-3d;
transition:.4s;

animation:fadeIn 1.5s;

}

.card:hover{

transform:rotateY(12deg) rotateX(8deg) scale(1.03);

}

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

.image{

width:250px;
height:250px;
margin:0 auto 20px;
border-radius:50%;
overflow:hidden;
border:6px solid rgba(255,255,255,.4);
box-shadow:
0 0 20px rgba(255,255,255,.35),
0 0 40px rgba(255,105,180,.4);
transition: .5s;

}
.image:hover{
    transform: scale(1.05);
}

.image img{

width:100%;
height:100%;
object-fit:cover;
object-position: center center;

}

.card h2{

margin-top:20px;
color:white;
font-size:28px;

}

.card p{

margin-top:15px;
color:#f1f1f1;
font-size:15px;
line-height:28px;

}

/* Button */

button{

margin-top:30px;
padding:15px 40px;
font-size:16px;
border:none;
border-radius:40px;
cursor:pointer;

background:linear-gradient(45deg,#ff6ec4,#7873f5);

color:white;
font-weight:600;

transition:.4s;

box-shadow:0 15px 35px rgba(0,0,0,.25);

}

button:hover{

transform:translateY(-5px) scale(1.05);

box-shadow:0 20px 45px rgba(255,105,180,.5);

}

/* Floating Hearts */

.hearts{

position:absolute;
width:100%;
height:100%;
overflow:hidden;
pointer-events:none;

}

.hearts span{

position:absolute;
font-size:22px;
animation:heartFloat linear infinite;
pointer-events: none;
text-shadow: 
      0 0 8px #ff4d6d,
      0 0 20px #ff4d6d,
      0 0 35px #ff99aa;

}

@keyframes heartFloat{

0%{

transform:translateY(-100px) scale(0.5);
opacity:0;

}

20%{

opacity:1;

}

100%{

transform:translateY(100vh) scale(1.3);
opacity:0;

}

}

</style>

</head>


<body>

<div class="background">

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

</div>

<div class="hearts" id="hearts"></div>

<header>
Welcome Sanyukta
</header>

<div class="card">

<div class="image">

<!-- Replace this image with your crush's photo -->
<img src="Our image.jpg" alt="Image">

</div>

<h2>A Memory for you Princess❤️</h2>

<p>
"Pehli mulaqat be-khabar thi, par ab ehsaas rang laaya hai,
        Is baar mile hain kuch aise, ki dil ne farz nibhaya hai"

</p>

<button onclick="window.location.href='surprise.html'">
    Click to pop this card
</button>

</div>

<!-- Required CSS rules for the script to work properly -->
<style>
  /* Prevents floating emojis from blocking clicks or creating horizontal scrollbars */
  #hearts {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    overflow: hidden;
    z-index: 999;
  }

  .floating-item {
    position: absolute;
    animation-name: fall;
    animation-timing-function: linear;
    user-select: none;
    will-change: transform;
  }

  @keyframes fall {
    0% {
      transform: translateY(0) rotate(0deg);
      opacity: 1;
    }
    100% {
      transform: translateY(105vh) rotate(360deg);
      opacity: 0;
    }
  }

  .card {
    transition: transform 0.1s ease-out; /* Smooths out mouse tracking */
    transform-style: preserve-3d;
  }
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const hearts = document.getElementById("hearts");
  const card = document.querySelector(".card");

  // 1. Floating Emojis
  if (hearts) {
    function createHeart() {
      const heart = document.createElement("span");
      const items = ["✨", "🌸", "💫", "🦋", "🪷", "💖","🍫"];

      heart.textContent = items[Math.floor(Math.random() * items.length)];
      heart.classList.add("floating-item");

      const duration = 4 + Math.random() * 4; // 4s to 8s
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.top = "-50px";
      heart.style.animationDuration = duration + "s";
      heart.style.fontSize = 18 + Math.random() * 18 + "px";

      hearts.appendChild(heart);

      // Remove after exact animation duration ends
      setTimeout(() => {
        heart.remove();
      }, duration * 1000);
    }

    setInterval(createHeart, 250);
  }

  // 2. 3D Card Tilt
  if (card) {
    document.addEventListener("mousemove", (e) => {
      // clientX/Y works relative to the viewport window
      const x = (window.innerWidth / 2 - e.clientX) / 25;
      const y = (window.innerHeight / 2 - e.clientY) / 25;

      card.style.transform = `rotateY(${x}deg) rotateX(${-y}deg)`;
    });

    document.addEventListener("mouseleave", () => {
      card.style.transform = "rotateY(0deg) rotateX(0deg)";
    });
  }
});
</script>
</body>
</html>
